[project]
name = "sharplab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "chess>=1.11.2",
    "discord-py>=2.7.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "matplotlib>=3.10.9",
    "nba-api>=1.11.4",
    "python-dotenv>=1.2.2",
    "temporalio",
    "tzdata>=2025.3",
    "uvicorn>=0.46.0",
    "yfinance>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["bot*", "db*", "shared*", "temporal*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
