[project]
name = "sharplab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.107.1",
    "chess>=1.11.2",
    "cryptography>=50.0.1",
    "discord-py>=2.7.1",
    "djtoolkit[kalshi] @ git+https://github.com/xpoes123/toolkit.git@v0.2.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "matplotlib>=3.10.9",
    "nba-api>=1.11.4",
    "python-dotenv>=1.2.2",
    "temporalio",
    "tzdata>=2025.3",
    "uvicorn>=0.46.0",
    "websockets>=16.0",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
# wall/adwatch.py's GPU speech-to-text (the homelab: `uv sync --extra adwatch`)
adwatch = ["faster-whisper>=1.1"]

[tool.setuptools.packages.find]
include = ["bot*", "db*", "shared*", "temporal*", "wall*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
