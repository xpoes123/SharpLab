[project]
name = "sharplab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "discord-py>=2.7.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "nba-api>=1.11.4",
    "python-dotenv>=1.2.2",
    "temporalio",
    "tzdata>=2025.3",
    "uvicorn>=0.46.0",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
include = ["bot*", "db*", "shared*", "temporal*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
