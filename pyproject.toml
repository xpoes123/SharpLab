[project]
name = "sharplab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "temporalio",
    "tzdata>=2025.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
