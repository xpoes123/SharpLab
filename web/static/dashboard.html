<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — SharpLab</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
    <div class="container dashboard-container">
        <header>
            <h1>SharpLab</h1>
            <p>Sports Trading Dashboard</p>
            <nav class="header-nav">
                <a href="/">Leaderboards</a>
                <a href="/dashboard" class="active">Dashboard</a>
            </nav>
        </header>

        <div class="sport-filter">
            <button class="sport-btn active" data-sport="all">All</button>
            <button class="sport-btn" data-sport="nba">NBA</button>
            <button class="sport-btn" data-sport="mlb">MLB</button>
        </div>

        <!-- Today's Slate -->
        <section id="slate">
            <div class="section-header">
                <h2>Today's Slate</h2>
                <span class="updated" id="slate-updated"></span>
            </div>
            <div id="slate-content">
                <div class="loading"><div class="spinner"></div>Loading...</div>
            </div>
        </section>

        <!-- Two-column: Trading + Results -->
        <div class="dashboard-grid">
            <section id="paper-trading">
                <h2>Paper Trading Leaderboard</h2>
                <div id="paper-content">
                    <div class="loading"><div class="spinner"></div>Loading...</div>
                </div>
            </section>

            <section id="recent-results">
                <h2>Recent Results</h2>
                <div id="results-content">
                    <div class="loading"><div class="spinner"></div>Loading...</div>
                </div>
            </section>
        </div>

        <!-- Injury Report -->
        <section id="injuries">
            <div class="section-header">
                <h2>Injury Report</h2>
            </div>
            <div id="injuries-content">
                <div class="loading"><div class="spinner"></div>Loading...</div>
            </div>
        </section>
    </div>
    <script src="/dashboard.js"></script>
</body>
</html>
