<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SharpLab HQ</title>
<style>
  :root {
    --bg: #15161e; --panel: #1a1b26; --panel2: #1f2230; --line: #2a2e42;
    --fg: #c0caf5; --muted: #7884b0; --accent: #7aa2f7; --accent2: #bb9af7;
    --green: #9ece6a; --red: #f7768e; --gold: #e0af68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #1a1b26, #15161e);
  }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: .5px; }
  .brand span { color: var(--accent2); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  .btn {
    background: var(--accent); color: #11121a; border: 0; border-radius: 10px;
    padding: 10px 16px; font-weight: 700; cursor: pointer; text-decoration: none;
    display: inline-block;
  }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .hero { text-align: center; padding: 72px 16px; }
  .hero h1 { font-size: 34px; margin: 0 0 8px; }
  .hero p { color: var(--muted); margin: 0 0 28px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .stat .value { font-size: 28px; font-weight: 800; margin-top: 4px; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .userbar { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--panel2); }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 28px 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank { color: var(--muted); width: 36px; }
  .me { background: rgba(122,162,247,.08); }
  .muted { color: var(--muted); }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand">Sharp<span>Lab</span> HQ</div>
  <div id="navRight"></div>
</header>
<main id="app">
  <div class="hero"><p class="muted">Loading…</p></div>
</main>

<script src="/hq.js"></script>
</body>
</html>
