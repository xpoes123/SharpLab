<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo — SharpLab</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/bingo.css">
</head>
<body>
    <div class="bingo-container">
        <div id="connection-status" class="status-bar"></div>

        <!-- Join Screen (shown when no token) -->
        <div id="join-screen" class="join-screen phase">
            <h1>Bingo</h1>
            <p class="subtitle">5x5 bingo cards, auto-called numbers, multiple win patterns.</p>
            <div class="join-form">
                <input type="text" id="player-name" placeholder="Your name" maxlength="20" autocomplete="off">
                <button id="create-room-btn" class="btn-join">Create Room</button>
                <button id="join-room-btn" class="btn-join" style="display:none">Join Room</button>
                <div class="error-msg" id="join-error"></div>
            </div>
        </div>

        <!-- Lobby -->
        <div id="lobby" class="phase">
            <h1>Bingo</h1>
            <p class="subtitle" id="pattern-info">Loading...</p>
            <div class="lobby-info">
                <div class="pot-label">Prize Pool</div>
                <div class="pot" id="lobby-pot">0c</div>
            </div>
            <ul class="player-list" id="lobby-players"></ul>
            <button id="start-btn" class="btn-primary" disabled>Start Game</button>
            <p class="waiting-text" id="waiting-text">Waiting for players to connect...</p>
            <div id="invite-section" class="invite-section" style="display:none">
                <div class="invite-label">Invite Link</div>
                <div class="invite-url-row">
                    <input type="text" id="invite-url" readonly>
                    <button id="copy-invite-btn">Copy</button>
                </div>
            </div>
        </div>

        <!-- Calling -->
        <div id="game" class="phase">
            <div class="called-display">
                <div class="last-called" id="last-called">-</div>
                <div class="called-count" id="called-count">0 called</div>
            </div>

            <div id="bingo-cards" class="bingo-cards"></div>

            <div id="player-progress" class="progress-bar-list"></div>

            <div class="called-board" id="called-board"></div>
        </div>

        <!-- Results -->
        <div id="results" class="phase">
            <h1 id="result-title">Game Over</h1>
            <table class="results-table">
                <thead><tr>
                    <th>#</th><th>Player</th><th>Cards</th><th>Cost</th><th>Payout</th><th>Net</th>
                </tr></thead>
                <tbody id="results-body"></tbody>
            </table>
            <a href="/" class="back-link" style="display:block;text-align:center;margin-top:20px">&larr; Back to Leaderboard</a>
        </div>
    </div>
    <script src="/bingo.js"></script>
</body>
</html>
