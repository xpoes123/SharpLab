<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The headless wall's private session bus. No service directories: nothing is ever D-Bus-activated on it, so the nested
     session's clients can't start xdg-desktop-portal(-kde), ksecretd or kwalletd (which crash-looped there, each crash a
     systemd-coredump). Only kwin (org.kde.KWin, for the tiling scripts) owns a name here. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
